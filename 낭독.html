<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>낭독</title>
<meta name="theme-color" content="#2a5bbf">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{--bg:#ffffff;--fg:#1d1d1f;--mut:#6e6e73;--card:#f5f5f7;--hl:#ffe49c;--read-bg:#fcf5e8;--accent:#d93025;--bd:#d2d2d7;--btn:#e8e8ed}
  @media (prefers-color-scheme: dark){
    :root{--bg:#1c1c1e;--fg:#f2f2f7;--mut:#a1a1a6;--card:#2c2c2e;--hl:#665300;--read-bg:#1c1c1e;--accent:#ff6b5e;--bd:#48484a;--btn:#3a3a3c}
  }
  *{box-sizing:border-box}
  body{margin:0;padding:8px;display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--bg);color:var(--fg);font:14pt/1.6 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
  h1{font-size:14pt;margin:0 0 8px}
  .ver{font-weight:400;color:var(--mut);margin-left:6px}
  .b-log{background:#6e6e73;margin-left:10px;padding:0 10px}
  .panel{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px}
  #script-input{display:block;width:100%;flex:1;min-height:0;font-family:inherit;font-size:14pt;line-height:2;color:var(--fg);background:var(--read-bg);border:1px solid var(--bd);border-top:none;border-radius:0;padding:14px 18px;resize:none;outline:none}
  button{font-family:inherit;font-size:14pt;color:#fff;background:#6e6e73;border:none;border-radius:8px;padding:4px 14px;cursor:pointer;font-weight:600}
  button:hover{filter:brightness(0.95)}
  .b-file{background:#7b4fc9}
  .b-edit{background:#2e9e5b}
  .b-mic{background:#2a5bbf}
  .b-mic.on{background:#d93025}
  .b-full{background:#0e8a96}
  .b-full.on{background:#d93025}
  .b-size{background:#d97a0b}
  #size-label,#bar label,#counter{padding:0 7px;border-radius:999px;font-weight:600;white-space:nowrap}
  #size-label{background:#fff1a8;color:#5a4a00}
  #bar label{background:#f0e3ff;color:#5b2a9e}
  #bar label input{accent-color:#7b4fc9}
  #bar label.l-adv{background:#d8f3e4;color:#14633b}
  #bar label.l-adv input{accent-color:#2e9e5b}
  #counter{background:#dbe8ff;color:#1c3f8f}
  @media (prefers-color-scheme: dark){
    #size-label{background:#665300;color:#fff1a8}
    #bar label{background:#4a3170;color:#e8d5ff}
    #bar label.l-adv{background:#1f5a3b;color:#d3f5e2}
    #counter{background:#1f3b66;color:#cfe0ff}
  }
  #reader{position:relative;display:flex;flex-direction:column;flex:1;min-height:0;background:var(--bg)}
  #bar{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:5px 6px;line-height:1.5;background:var(--card);border:1px solid var(--bd);border-radius:10px 10px 0 0}
  #bar .sp{flex:0 0 0}
  #counter{margin-left:auto}
  #bar label{display:flex;align-items:center;gap:4px;flex:1 1 auto;max-width:420px}
  #bar label > span:last-child{min-width:1.9em;text-align:right}
  #bar, #bar button, #bar label, #size-label, #counter{font-size:18pt}
  #bar button{padding:0 7px;white-space:nowrap}
  #bar button.b-size{padding:0 6px}
  #bar input[type=range]{flex:1 1 50px;width:50px;min-width:50px;margin:0}
  #text{overflow-y:auto;flex:1;min-height:0;padding:.8em max(8%, calc((100% - 36em) / 2));background:var(--read-bg);text-align:justify;border:1px solid var(--bd);border-top:none;font-size:14pt;line-height:2;scroll-behavior:auto}
  .s{padding:.2em 8px;margin:0 0 1em;border-radius:8px;cursor:pointer;white-space:pre-wrap;word-break:keep-all;opacity:.5;transition:opacity .15s}
  .s:hover{opacity:.8}
  .s.cur{background:var(--hl);opacity:1}
  #btn-undo{display:none;position:absolute;left:26px;bottom:60px;z-index:5;background:#d97a0b;border-radius:999px;padding:2px 16px;box-shadow:0 2px 8px rgba(0,0,0,.35);font-size:18pt}
  #btn-top{display:none;position:absolute;right:26px;bottom:60px;z-index:5;background:#2a5bbf;border-radius:999px;padding:2px 16px;box-shadow:0 2px 8px rgba(0,0,0,.35);font-size:18pt}
  #status{padding:6px 10px;border:1px solid var(--bd);border-top:none;border-radius:0 0 10px 10px;color:var(--mut);background:var(--card);min-height:2em}
  #reader:fullscreen{height:100vh;padding:0}
  #reader:fullscreen #text, #reader:fullscreen #script-input{flex:1;height:auto}
  #reader:fullscreen #bar{border-radius:0}
  #reader:fullscreen #status{border-radius:0}
</style>
</head>
<body>

<h1>🎤 낭독 <span class="ver" id="ver">v1006-3</span> <button id="btn-log" class="b-log" title="최근 인식 기록을 복사합니다. 흔들릴 때 붙여넣어 보내 주세요">📋 기록 복사</button></h1>

<div id="reader">
  <div id="bar">
    <button id="btn-file" class="b-file" title="txt, 워드(docx), 한글(hwp, hwpx), PDF 파일을 대본 창으로 불러옵니다">📂 불러오기</button>
    <input type="file" id="file-input" accept=".txt,.md,.docx,.pdf,.hwp,.hwpx,text/plain" hidden>
    <button id="btn-edit" class="b-edit" title="대본을 붙여넣거나 고칠 때 누르세요">✔ 완료</button>
    <button id="btn-mic" class="b-mic" title="마이크로 읽는 소리를 듣고 따라갑니다">🎤 시작</button>
    <button id="btn-full" class="b-full">⛶ 전체화면</button>
    <button id="btn-smaller" class="b-size">A−</button>
    <button id="btn-bigger" class="b-size">A+</button>
    <span id="size-label">24pt</span>
    <label title="겹침: 가운데가 기본(0). 왼쪽으로 옮기면 느리고 엄격하게, 오른쪽으로 옮기면 빠르고 쉽게 문장을 따라갑니다"><span>겹침</span> <input type="range" id="th" min="-10" max="10" step="1" value="0" autocomplete="off"><span id="th-label">0</span></label>
    <label class="l-adv" title="넘김: 가운데가 기본(0). 왼쪽으로 옮기면 문장을 더 읽은 뒤 느리게, 오른쪽으로 옮기면 일찍 빠르게 다음 문장으로 넘어갑니다"><span>넘김</span> <input type="range" id="adv" min="-10" max="10" step="1" value="0" autocomplete="off"><span id="adv-label">0</span></label>
    <span class="sp"></span>
    <span id="counter">0 / 0</span>
  </div>
  <textarea id="script-input" placeholder="여기에 대본을 붙여넣고 ✔ 완료를 누르세요. 줄바꿈과 마침표(. ? !) 기준으로 문장을 나눕니다."></textarea>
  <div id="text" style="display:none"></div>
  <button id="btn-undo" title="방금 먼 문장으로 옮겨진 것을 원래 문장으로 되돌립니다">↩ 되돌리기</button>
  <button id="btn-top" title="대본 맨 위로 이동합니다">⬆ 위로</button>
  <div id="status"></div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  var sentences = [];   // 원문 문장
  var norms = [];       // 비교용(띄어쓰기·부호 제거) 문장
  var sets = [];        // 문장별 2글자 묶음 집합
  var els = [];         // 문장 DOM
  var cur = 0;
  var holdIdx = -1;     // 방금 넘어온 문장(말이 아직 끝나는 중이라 되돌아가지 않게 막음)
  var holdUntil = 0, holdFin = 0;
  var baseLen = 0, lastNormLen = 0;   // 클릭 전에 인식된 글자는 비교에서 뺌
  var missCount = 0, recIdx = -1, recCount = 0;   // 건너뛰기 자동 감지용
  var backIdx = -1, backCount = 0;                // 문장을 옮길 때 연속 확인용
  var lastEventTime = 0;                          // 마지막으로 소리를 인식한 시각(쉬었다 읽는 것을 알아채기 위함)
  var APP_VERSION = 'v1006-3';
  var logRows = [], decision = '', lastCurScore = 0, lastLocked = false;   // 인식 기록(흔들림 분석용)
  var lastHeard = 0, wakeLock = null, silenceTimer = null, saveTimer = null, editStartText = '';
  var lockUntil = 0, advTimer = null;             // 지금 문장에 '올인'하는 시간 / 넘김 대기 타이머
  var farIdx = -1, farCount = 0;                  // 먼 문장으로 옮길 때 연속 확인용
  var advCount = 0, lastAdvance = 0;              // 다음 문장으로 넘길 때 연속 확인용
  var df = {};                                    // 2글자 묶음이 대본의 몇 문장에 나오는지
  var undoIdx = -1, blockIdx = -1, blockUntil = 0, undoTimer = null;   // 먼 이동 되돌리기용
  var wantListen = false;
  var rec = null;
  var readerPt = 24;   // 대본 글자 크기 기본값(pt)
  var lastUserScroll = 0;
  var editing = true;   // true: 대본 입력/수정, false: 읽기

  var BEHIND = 2, AHEAD = 12, TAIL = 20;

  function norm(s){ return s.replace(/[^\p{L}\p{N}]/gu, ''); }

  // 대본의 한자 주석은 말로 읽지 않으므로, 비교할 때만 뺌 (화면 글은 그대로)
  function stripNotes(s){
    return s.replace(/[\u4e00-\u9fff\u3400-\u4dbf]+\s*[(（]\s*([가-힣]+)\s*[)）]/g, '$1')        // 水氣(수기) → 수기
            .replace(/[(（][^)）]*[\u4e00-\u9fff\u3400-\u4dbf][^)）]*[)）]/g, '');                 // 수기(水氣) → 수기
  }
  function matchNorm(s){ var m = norm(stripNotes(s)); return m.length ? m : norm(s); }

  // 이 컴퓨터(브라우저)에만 저장: 대본, 읽던 위치, 글자 크기
  function lsGet(k){ try { return localStorage.getItem('nangdok:' + k); } catch (e) { return null; } }
  function lsSet(k, v){ try { localStorage.setItem('nangdok:' + k, v); } catch (e) { /* 저장 공간 부족 등은 무시 */ } }

  // 인식 기록
  function pad2(n){ return (n < 10 ? '0' : '') + n; }
  function fmtTime(t){
    var d = new Date(t), ms = d.getMilliseconds();
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()) + '.' + (ms < 10 ? '00' : ms < 100 ? '0' : '') + ms;
  }
  function pushLog(row){ logRows.push(row); if (logRows.length > 500) logRows.shift(); }
  function logNote(msg){ pushLog({ t: Date.now(), note: msg, to: cur }); }
  function bigrams(s){ var a = []; for (var i = 0; i < s.length - 1; i++) a.push(s.slice(i, i + 2)); return a; }
  function setStatus(m){ $('status').textContent = m; }
  // 슬라이더는 가운데가 0(기본). 오른쪽(+)일수록 빠르게, 왼쪽(-)일수록 느리게
  function threshold(){        // 겹침 기준: 기본 50%, 오른쪽 끝 30%(쉽게), 왼쪽 끝 90%(엄격하게)
    var s = parseInt($('th').value, 10);
    return (s >= 0 ? 50 - s * 2 : 50 - s * 4) / 100;
  }
  function advancePoint(){     // 넘김 시점: 0 = 문장 끝(97%)까지 읽은 뒤, 오른쪽 끝(+10)은 70%에서 일찍
    var s = parseInt($('adv').value, 10);
    return s > 0 ? 0.97 - s * 0.027 : 0.97;
  }
  function advanceDelay(){     // 왼쪽(-)일수록 문장을 다 읽은 뒤 조금 더 기다렸다가 넘김 (최대 1.5초)
    var s = parseInt($('adv').value, 10);
    return s < 0 ? -s * 150 : 0;
  }
  function signed(v){ v = parseInt(v, 10); return v > 0 ? '+' + v : String(v); }

  /* ==FILEREAD-START== */
  /* ---------- 파일 읽기 (txt, md, docx, hwpx, hwp, pdf) ---------- */
  function u16(d, o){ return d[o] | (d[o + 1] << 8); }
  function u32(d, o){ return (d[o] | (d[o + 1] << 8) | (d[o + 2] << 16) | (d[o + 3] << 24)) >>> 0; }

  async function inflateRaw(bytes){
    var ds = new DecompressionStream('deflate-raw');
    var stream = new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  // zip 안에서 원하는 파일만 꺼냄
  async function unzipEntries(bytes, wanted){
    var end = -1;
    for (var i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--){
      if (u32(bytes, i) === 0x06054b50){ end = i; break; }
    }
    if (end < 0) throw new Error('올바른 문서 파일이 아닙니다.');
    var count = u16(bytes, end + 10), p = u32(bytes, end + 16), out = {};
    for (var n = 0; n < count; n++){
      if (u32(bytes, p) !== 0x02014b50) break;
      var method = u16(bytes, p + 10), csize = u32(bytes, p + 20);
      var nlen = u16(bytes, p + 28), elen = u16(bytes, p + 30), clen = u16(bytes, p + 32), lho = u32(bytes, p + 42);
      var name = new TextDecoder('utf-8').decode(bytes.subarray(p + 46, p + 46 + nlen));
      if (wanted(name)){
        var start = lho + 30 + u16(bytes, lho + 26) + u16(bytes, lho + 28);
        var raw = bytes.subarray(start, start + csize);
        if (method === 0) out[name] = raw;
        else if (method === 8) out[name] = await inflateRaw(raw);
      }
      p += 46 + nlen + elen + clen;
    }
    return out;
  }

  function xmlDecode(s){
    return s.replace(/&#x([0-9a-fA-F]+);/g, function(m, x){ return String.fromCodePoint(parseInt(x, 16)); })
            .replace(/&#(\d+);/g, function(m, x){ return String.fromCodePoint(parseInt(x, 10)); })
            .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');
  }

  function docxText(xml){
    var out = [];
    xml.split('</w:p>').forEach(function(para){
      var line = '', m, re = /<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>|<w:tab\s*\/>|<w:br\s*\/>/g;
      while ((m = re.exec(para))){
        if (m[1] !== undefined) line += xmlDecode(m[1]);
        else line += (m[0].indexOf('tab') > 0 ? '\t' : '\n');
      }
      out.push(line);
    });
    return out.join('\n');
  }

  function hwpxText(xml){
    var out = [];
    xml.split('</hp:p>').forEach(function(para){
      var line = '', m, re = /<hp:t(?:\s[^>]*)?>([\s\S]*?)<\/hp:t>/g;
      while ((m = re.exec(para))) line += xmlDecode(m[1].replace(/<[^>]*>/g, ''));
      out.push(line);
    });
    return out.join('\n');
  }

  // 한글(.hwp)은 복합 문서(CFB) 형식 — 안의 스트림을 꺼내 읽음
  function cfbParse(d){
    var sig = [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1];
    for (var i = 0; i < 8; i++) if (d[i] !== sig[i]) throw new Error('올바른 한글(.hwp) 파일이 아닙니다.');
    var ss = 1 << u16(d, 0x1E), mss = 1 << u16(d, 0x20);
    var firstDir = u32(d, 0x30), cutoff = u32(d, 0x38), firstMini = u32(d, 0x3C), difatStart = u32(d, 0x44), difatCount = u32(d, 0x48);
    function sec(id){ var o = (id + 1) * ss; return d.subarray(o, o + ss); }
    var fatIds = [], v;
    for (i = 0; i < 109; i++){ v = u32(d, 0x4C + i * 4); if (v < 0xFFFFFFFA) fatIds.push(v); }
    var dsid = difatStart;
    for (var k = 0; k < difatCount && dsid < 0xFFFFFFFA; k++){
      var s = sec(dsid);
      for (var j = 0; j < ss / 4 - 1; j++){ v = u32(s, j * 4); if (v < 0xFFFFFFFA) fatIds.push(v); }
      dsid = u32(s, ss - 4);
    }
    var fat = [];
    fatIds.forEach(function(id){ var s2 = sec(id); for (var j2 = 0; j2 < ss / 4; j2++) fat.push(u32(s2, j2 * 4)); });
    function chain(start){
      var ids = [], guard = 0;
      while (start < 0xFFFFFFFA && guard++ <= fat.length){ ids.push(start); start = fat[start]; }
      return ids;
    }
    function readChain(start, size){
      var ids = chain(start), out = new Uint8Array(ids.length * ss);
      ids.forEach(function(id, n){ out.set(sec(id), n * ss); });
      return size == null ? out : out.subarray(0, size);
    }
    var dir = readChain(firstDir), entries = [];
    for (var e = 0; e + 128 <= dir.length; e += 128){
      var nl = u16(dir, e + 64), name = '';
      for (var c = 0; c < nl / 2 - 1; c++) name += String.fromCharCode(u16(dir, e + c * 2));
      entries.push({ name: name, type: dir[e + 66], left: u32(dir, e + 68), right: u32(dir, e + 72), child: u32(dir, e + 76), start: u32(dir, e + 116), size: u32(dir, e + 120) });
    }
    if (!entries.length) throw new Error('올바른 한글(.hwp) 파일이 아닙니다.');
    var miniStream = null, miniFat = null;
    function readStream(en){
      if (en.size < cutoff){
        if (!miniStream){
          miniStream = readChain(entries[0].start, entries[0].size);
          var mf = readChain(firstMini); miniFat = [];
          for (var q = 0; q + 4 <= mf.length; q += 4) miniFat.push(u32(mf, q));
        }
        var ids = [], s3 = en.start, guard = 0;
        while (s3 < 0xFFFFFFFA && guard++ <= miniFat.length){ ids.push(s3); s3 = miniFat[s3]; }
        var out = new Uint8Array(ids.length * mss);
        ids.forEach(function(id, n){ out.set(miniStream.subarray(id * mss, id * mss + mss), n * mss); });
        return out.subarray(0, en.size);
      }
      return readChain(en.start, en.size);
    }
    var paths = {};
    function walk(id, prefix){
      if (id >= entries.length) return;
      var en = entries[id];
      if (en.seen) return;
      en.seen = true;
      walk(en.left, prefix);
      paths[prefix + en.name] = en;
      if (en.type === 1 || en.type === 5) walk(en.child, prefix + en.name + '/');
      walk(en.right, prefix);
    }
    entries[0].seen = true;
    walk(entries[0].child, '');
    return { paths: paths, readStream: readStream };
  }

  function hwpSection(d){
    var pos = 0, res = '';
    while (pos + 4 <= d.length){
      var hd = u32(d, pos); pos += 4;
      var tag = hd & 0x3FF, size = hd >>> 20;
      if (size === 0xFFF){ size = u32(d, pos); pos += 4; }
      if (tag === 67){   // 문단 글자 기록
        var end = Math.min(pos + size, d.length), i = pos;
        while (i + 2 <= end){
          var c = u16(d, i); i += 2;
          if (c >= 32) res += String.fromCharCode(c);
          else if (c === 13 || c === 10) res += '\n';
          else if (c === 9){ res += '\t'; i += 14; }
          else if (c === 30 || c === 31) res += ' ';
          else if (c === 0 || (c >= 24 && c <= 29)) { /* 건너뜀 */ }
          else i += 14;   // 표·그림 등 컨트롤은 16바이트 차지
        }
      }
      pos += size;
    }
    return res;
  }

  async function hwpText(bytes){
    var cfb = cfbParse(bytes);
    var fh = cfb.paths['FileHeader'];
    if (!fh) throw new Error('올바른 한글(.hwp) 파일이 아닙니다.');
    var flags = u32(cfb.readStream(fh), 36);
    if (flags & 2) throw new Error('암호가 걸린 한글 파일은 읽을 수 없습니다. 암호를 푼 뒤 다시 시도해 주세요.');
    if (flags & 4) throw new Error('배포용 한글 문서는 읽을 수 없습니다. 복사해서 붙여넣어 주세요.');
    var names = Object.keys(cfb.paths).filter(function(n){ return /^BodyText\/Section\d+$/.test(n); })
      .sort(function(a, b){ return parseInt(a.slice(16), 10) - parseInt(b.slice(16), 10); });
    if (!names.length) throw new Error('한글 문서에서 본문을 찾지 못했습니다.');
    var parts = [];
    for (var i = 0; i < names.length; i++){
      var data = cfb.readStream(cfb.paths[names[i]]);
      if (flags & 1) data = await inflateRaw(data);
      parts.push(hwpSection(data));
    }
    return parts.join('\n');
  }

  // PDF는 줄 끝에서 끊겨 있으므로, 문장 부호로 끝나는 줄까지 이어 붙임
  function mergePdfLines(s){
    var out = [], cur = '';
    s.split('\n').forEach(function(line){
      line = line.trim();
      if (!line){ if (cur){ out.push(cur); cur = ''; } return; }
      cur += (cur ? ' ' : '') + line;
      if (/[.!?。…”"')」』]$/.test(line)){ out.push(cur); cur = ''; }
    });
    if (cur) out.push(cur);
    return out.join('\n');
  }

  var pdfReady = null;
  function loadPdfJs(){
    if (window.pdfjsLib) return Promise.resolve();
    if (!pdfReady) pdfReady = new Promise(function(res, rej){
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload = function(){
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        res();
      };
      s.onerror = function(){ pdfReady = null; rej(new Error('PDF 읽기 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.')); };
      document.head.appendChild(s);
    });
    return pdfReady;
  }

  async function pdfText(bytes){
    await loadPdfJs();
    var pdf = await window.pdfjsLib.getDocument({ data: bytes }).promise;
    var s = '';
    for (var p = 1; p <= pdf.numPages; p++){
      var page = await pdf.getPage(p), tc = await page.getTextContent(), lastY = null;
      tc.items.forEach(function(it){
        if (typeof it.str !== 'string') return;
        var y = it.transform ? it.transform[5] : null;
        if (lastY !== null && y !== null && Math.abs(y - lastY) > 2 && s.slice(-1) !== '\n') s += '\n';
        s += it.str;
        if (it.hasEOL) s += '\n';
        if (y !== null && it.str.trim() !== '') lastY = y;
      });
      s += '\n';
    }
    if (!s.trim()) throw new Error('이 PDF에는 읽을 수 있는 글자가 없습니다(스캔한 그림 PDF일 수 있습니다).');
    return mergePdfLines(s);
  }

  function decodeText(bytes){
    try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes); }
    catch (err) { return new TextDecoder('euc-kr').decode(bytes); }   // 옛 메모장(ANSI) 파일
  }

  async function readFileText(f){
    var name = f.name.toLowerCase();
    var bytes = new Uint8Array(await f.arrayBuffer()), text, z, keys;
    var byNum = function(a, b){ return parseInt(a.replace(/\D/g, ''), 10) - parseInt(b.replace(/\D/g, ''), 10); };
    if (/\.docx$/.test(name)){
      z = await unzipEntries(bytes, function(n){ return n === 'word/document.xml'; });
      if (!z['word/document.xml']) throw new Error('올바른 워드(.docx) 파일이 아닙니다.');
      text = docxText(new TextDecoder('utf-8').decode(z['word/document.xml']));
    } else if (/\.hwpx$/.test(name)){
      z = await unzipEntries(bytes, function(n){ return /^Contents\/section\d+\.xml$/i.test(n); });
      keys = Object.keys(z).sort(byNum);
      if (!keys.length) throw new Error('올바른 한글(.hwpx) 파일이 아닙니다.');
      text = keys.map(function(k){ return hwpxText(new TextDecoder('utf-8').decode(z[k])); }).join('\n');
    } else if (/\.hwp$/.test(name)){
      text = await hwpText(bytes);
    } else if (/\.pdf$/.test(name)){
      text = await pdfText(bytes);
    } else if (/\.(doc|xls|xlsx|ppt|pptx)$/.test(name)){
      throw new Error('이 형식은 읽을 수 없습니다. 워드는 .docx로 저장한 뒤 불러와 주세요.');
    } else {
      text = decodeText(bytes);
    }
    text = text.replace(/^\uFEFF/, '').replace(/\r/g, '').replace(/\u00a0/g, ' ').replace(/\n{3,}/g, '\n\n');
    if (!text.trim()) throw new Error('읽어 온 글자가 없습니다.');
    return text;
  }
  /* ==FILEREAD-END== */

  /* ---------- 대본 불러오기 ---------- */
  function splitScript(text){
    var out = [];
    text.split(/\r?\n/).forEach(function(line){
      line = line.trim();
      if (!line) return;
      var parts = line.split(/(?<=[.!?。…])\s+/).map(function(s){ return s.trim(); }).filter(function(s){ return s; });
      for (var i = 0; i < parts.length; i++){
        // 줄 맨 앞의 번호(1. ② 가. 등)는 뒤따르는 글과 한 문장으로 묶음
        if (/^(?:\(?\d{1,3}[.)]|[①-⑳]|[가-하]\.|[A-Za-z]\.|[ⅰ-ⅹⅠ-Ⅹ]+\.)$/.test(parts[i]) && i + 1 < parts.length){
          parts[i + 1] = parts[i] + ' ' + parts[i + 1];
          continue;
        }
        if (norm(parts[i]).length > 0) out.push(parts[i]);
      }
    });
    return out;
  }

  function loadScript(){
    var text = $('script-input').value;
    sentences = splitScript(text);
    norms = sentences.map(matchNorm);
    sets = norms.map(function(n){ return new Set(bigrams(n)); });
    df = {};
    sets.forEach(function(st){ st.forEach(function(bg){ df[bg] = (df[bg] || 0) + 1; }); });
    farIdx = -1; farCount = 0; advCount = 0; backIdx = -1; backCount = 0; undoIdx = -1;
    var box = $('text');
    box.innerHTML = '';
    els = sentences.map(function(s, i){
      var d = document.createElement('div');
      d.className = 's';
      d.dataset.i = i;
      d.textContent = s;
      box.appendChild(d);
      return d;
    });
    cur = 0; holdIdx = -1;
    box.scrollTop = 0;
    if (els.length) els[0].classList.add('cur');
    updateCounter();
    lsSet('script', text); lsSet('cur', '0');
    setStatus(sentences.length ? ('대본 ' + sentences.length + '문장을 불러왔습니다.') : '불러올 문장이 없습니다.');
    return sentences.length > 0;
  }

  function setMode(edit){
    editing = edit;
    $('script-input').style.display = edit ? 'block' : 'none';
    $('text').style.display = edit ? 'none' : 'block';
    $('btn-edit').textContent = edit ? '✔ 완료' : '✏️ 편집';
    if (edit) $('script-input').focus();
    else scrollToCur();
    updateTopBtn();
  }

  function updateCounter(){ $('counter').textContent = (sentences.length ? cur + 1 : 0) + ' / ' + sentences.length; }

  function setCur(i){
    if (els[cur]) els[cur].classList.remove('cur');
    cur = i;
    holdIdx = -1; holdUntil = 0; holdFin = 0;
    advCount = 0;
    lockUntil = 0;
    clearTimeout(advTimer); advTimer = null;
    if (els[cur]) els[cur].classList.add('cur');
    updateCounter();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ lsSet('cur', String(cur)); }, 400);
  }

  /* ---------- 스크롤 ---------- */
  function topBox(){ return editing ? $('script-input') : $('text'); }
  function updateTopBtn(){ $('btn-top').style.display = topBox().scrollTop > 80 ? 'block' : 'none'; }
  $('text').addEventListener('scroll', updateTopBtn);
  $('script-input').addEventListener('scroll', updateTopBtn);
  $('btn-top').addEventListener('click', function(){
    lastUserScroll = Date.now();
    topBox().scrollTo({ top: 0, behavior: 'smooth' });
  });

  function userScrolling(){ return Date.now() - lastUserScroll < 1500; }

  function scrollToCur(){
    if (userScrolling() || !els[cur]) return;
    var box = $('text');
    var r = els[cur].getBoundingClientRect();
    var b = box.getBoundingClientRect();
    var target = box.scrollTop + (r.top - b.top) - box.clientHeight * 0.25;
    box.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
  }

  ['wheel', 'touchmove', 'keydown'].forEach(function(ev){
    $('text').addEventListener(ev, function(){ lastUserScroll = Date.now(); }, { passive: true });
  });

  /* ---------- 문장 비교 ---------- */
  // 여러 문장에 나오는 흔한 말은 점수를 낮추고, 한두 문장에만 나오는 말은 높게 침
  function rarity(bg){
    var N = sentences.length;
    if (N < 8) return 1;
    var c = df[bg] || 0;
    if (c <= 0) return 1;
    var f = c / N;
    if (f <= 0.05) return 1;
    if (f >= 0.4) return 0.25;
    return 1 - (f - 0.05) * (0.75 / 0.35);
  }

  function weightsFor(tail){
    var tb = bigrams(tail);
    if (!tb.length) return null;
    var wts = [], total = 0;
    for (var k = 0; k < tb.length; k++){
      var w = (k + 1) * rarity(tb[k]);   // 최근에 말한 부분일수록 가중치↑
      wts.push(w); total += w;
    }
    return { wts: wts, total: total };
  }

  // 말한 글자(tail)가 문장에 '이어서, 순서대로' 들어 있는 만큼 점수를 냄
  // (짧게 떨어진 일치는 점수를 깎아서 '고목나무' 같은 반복 표현만으로는 점수가 같아지지 않게 함)
  // excl이 있으면, 그 문장(지금 문장)에도 들어 있는 말은 빼고 '이 문장에만 있는 말'로 점수를 냄
  function scoreSentence(i, tail, W, excl){
    var ns = norms[i], L = tail.length, k = 0, covered = 0;
    while (k < L - 1){
      var m = 2;
      while (k + m <= L && ns.indexOf(tail.slice(k, k + m)) >= 0) m++;
      var r = m - 2;                 // 이어서 맞은 2글자 묶음 개수
      if (r >= 1){
        var w = 0;
        for (var t = k; t < k + r; t++) w += W.wts[t];
        var shared = (excl !== undefined && excl >= 0 && excl !== i && norms[excl].indexOf(tail.slice(k, k + r + 1)) >= 0);
        if (!shared) covered += w * (r >= 3 ? 1 : (r === 2 ? 0.5 : 0));
        k += r;
      } else {
        k++;
      }
    }
    return covered / W.total;
  }

  // 지금 문장을 얼마나 읽었는지: 말 끝부분이 문장 안에 '이어서' 들어 있는 위치로 계산
  function readProgress(tail, idx){
    if (idx < 0 || !norms[idx]) return 0;
    var ns = norms[idx];
    for (var len = Math.min(tail.length, 12); len >= 4; len--){
      var p = ns.indexOf(tail.slice(tail.length - len));
      if (p >= 0) return (p + len) / ns.length;
    }
    return 0;
  }

  // 앞뒤 범위에서 못 찾는 상태가 이어질 때, 대본 전체에서 찾음 (아주 확실할 때만)
  function findGlobal(tail, W){
    var need = Math.max(threshold() + 0.30, 0.80), best = -1, s1 = 0, s2 = 0;
    for (var i = 0; i < sentences.length; i++){
      if (i === blockIdx && Date.now() < blockUntil) continue;
      var score = scoreSentence(i, tail, W);
      if (score > s1){ s2 = s1; s1 = score; best = i; }
      else if (score > s2){ s2 = score; }
    }
    if (best < 0 || s1 < need || s1 - s2 < 0.25 || (best <= holdIdx && Date.now() < holdUntil)){ recIdx = -1; recCount = 0; return -1; }   // 비슷한 문장이 여럿이거나 방금 지나온 곳이면 옮기지 않음
    if (best === recIdx) recCount++; else { recIdx = best; recCount = 1; }
    if (recCount >= 3){ recIdx = -1; recCount = 0; missCount = 0; return best; }
    return -1;
  }

  // 먼 이동 뒤 5초 동안 '되돌리기' 버튼을 보여 줌
  function showUndo(fromIdx, toIdx){
    undoIdx = fromIdx; blockIdx = toIdx;
    $('btn-undo').style.display = 'block';
    clearTimeout(undoTimer);
    undoTimer = setTimeout(function(){ $('btn-undo').style.display = 'none'; }, 5000);
  }
  function hideUndo(){ clearTimeout(undoTimer); $('btn-undo').style.display = 'none'; }
  $('btn-undo').addEventListener('click', function(){
    hideUndo();
    if (undoIdx < 0 || undoIdx >= sentences.length) return;
    setCur(undoIdx);
    baseLen = lastNormLen;                 // 되돌린 뒤에는 그때까지 한 말을 비교에서 뺌
    blockUntil = Date.now() + 10000;       // 방금 옮겨졌던 문장으로는 잠시 다시 옮기지 않음
    missCount = 0; recIdx = -1; recCount = 0; farIdx = -1; farCount = 0;
    lastUserScroll = 0;
    scrollToCur();
    logNote('되돌리기 → ' + (cur + 1) + '번째 문장');
    setStatus('↩ ' + (cur + 1) + '번째 문장으로 되돌렸습니다.');
  });

  function doAdvance(finished, consumeLen){
    if (cur + 1 >= sentences.length) return;
    var prev = cur;
    setCur(cur + 1);
    if (finished){
      // 다 읽은 문장은 인식 기록에서 지움: 남아 있는 앞 문장 끝말이 다른 문장과 겹쳐 보이는 일을 막음
      baseLen = Math.max(baseLen, consumeLen || 0);
    } else {
      holdIdx = prev;
      holdUntil = Date.now() + 12000;
      holdFin = 0;
    }
    lastAdvance = Date.now();
    logNote('넘김 ' + (prev + 1) + '→' + (cur + 1) + (finished ? '' : ' (일찍)'));
    scrollToCur();
  }
  function scheduleAdvance(idx, ms, finished, len){
    if (advTimer) return;
    advTimer = setTimeout(function(){
      advTimer = null;
      if (cur === idx) doAdvance(finished, len);
    }, ms);
  }

  function handleSpeech(text){
    var before = cur;
    decision = '';
    handleSpeechCore(text);
    pushLog({ t: Date.now(), tail: text.replace(/\s+/g, ' ').slice(-28), from: before, to: cur, dec: decision || (lastLocked ? '유지(올인)' : '유지'), cs: lastCurScore });
  }

  function handleSpeechCore(text){
    if (!sentences.length) return;
    var full = norm(text);
    var nowT = Date.now();
    if (lastEventTime && nowT - lastEventTime > 1200) baseLen = lastNormLen;   // 1.2초 넘게 쉬었다 읽으면, 그 전에 한 말은 비교에서 뺌
    lastEventTime = nowT;
    lastNormLen = full.length;
    var n = full.slice(baseLen);
    if (n.length < 4){ decision = '짧아서 무시'; return; }
    var tail = n.slice(-TAIL);
    var W = weightsFor(tail);
    if (!W) return;

    var th = threshold();
    var from = cur, to = Math.min(sentences.length - 1, cur + AHEAD);   // 앞으로만 따라감
    var curScore = scoreSentence(cur, tail, W);
    // 지금 문장이 맞고 있으면 5초 동안 '올인': 다음 문장으로 넘어가는 것 외에는 다른 문장으로 옮기지 않음
    if (curScore >= th * 0.7) lockUntil = Math.max(lockUntil, nowT + 5000);
    var locked = nowT < lockUntil;
    lastCurScore = curScore; lastLocked = locked;
    // 방금 넘어온 앞 문장은 '다 읽을 때까지' 되돌아가지 않게 막음 (새 문장을 읽기 시작하면 바로 풀림)
    var holdOn = Date.now() < holdUntil;
    if (holdOn){
      if (curScore >= th) holdOn = false;                          // 새 문장을 읽기 시작함
      else if (readProgress(tail, holdIdx) >= 0.95){               // 앞 문장을 다 읽음 → 그 기록은 비교에서 뺌
        baseLen = lastNormLen; holdUntil = 0; decision = '앞 문장을 다 읽음';
        return;
      }
      if (!holdOn) holdUntil = 0;
    }
    var near = -1, nearScore = 0, far = -1, farScore = 0, scores = {};
    for (var i = from; i <= to; i++){
      if (holdOn && i <= holdIdx) continue;    // 방금 넘어온 문장과 그 위쪽은 잠시 제외
      var score = (i === cur) ? curScore : scoreSentence(i, tail, W);
      scores[i] = score;
      var isFar = i > cur + 3;
      var need = th;
      if (i < cur) need += 0.10;        // 위로 올라가는 것도 더 엄격하게
      if (n.length < 8) need += 0.2;    // 말이 짧을수록 더 엄격하게
      if (isFar) need = Math.max(th + 0.15, 0.80);   // 4문장 이상 앞은 아주 엄격하게
      if (score < need) continue;
      if (isFar){
        if (n.length < 14) continue;
        if (locked) continue;   // 지금 문장을 읽는 중이면 먼 문장으로 안 옮김
        if (i === blockIdx && Date.now() < blockUntil) continue;
        if (score > farScore){ far = i; farScore = score; }
        continue;
      }
      if (i !== cur){
        // 같은 단어(예: '수기')가 여러 문장에 있어도, 지금 문장에 없고 이 문장에만 있는 말이 있어야 옮김
        var uniq = scoreSentence(i, tail, W, cur);
        if (uniq < 0.15) continue;
        // 지금 문장을 읽고 있는 중이면 올인: 바로 다음 문장이 그 문장에만 있는 말로 확실히 맞을 때만 옮김
        if (locked && (i !== cur + 1 || uniq < 0.30 || score < th + 0.10 || score < curScore)) continue;
      }
      if (score > nearScore + 0.02 || (Math.abs(score - nearScore) <= 0.02 && near >= 0 && Math.abs(i - cur) < Math.abs(near - cur))){
        near = i; nearScore = score;
      }
    }
    // 먼 문장은 다른 문장과 점수 차이가 25% 이상 나야 후보
    if (far >= 0){
      var other = 0;
      for (var key in scores){ if (parseInt(key, 10) !== far && scores[key] > other) other = scores[key]; }
      if (farScore - other < 0.25) far = -1;
    }

    var shown = full.length > 30 ? '…' + text.replace(/\s+/g, ' ').slice(-30) : text;
    var note = '', best = -1, bigMove = false;
    if (far >= 0 && (near < 0 || farScore >= nearScore + 0.10)){
      if (far === farIdx) farCount++; else { farIdx = far; farCount = 1; }
      if (farCount < 3){ decision = '먼 문장 확인 중 → ' + (far + 1) + ' (' + farCount + '/3)'; setStatus('🎤 듣는 중: ' + shown + '  (먼 문장 확인 중)'); return; }
      best = far; bigMove = true; farIdx = -1; farCount = 0;
    } else {
      farIdx = -1; farCount = 0;
      best = near;
    }

    if (best < 0){
      missCount++;
      var jump = (missCount >= 4 && n.length >= 14 && !locked) ? findGlobal(tail, W) : -1;
      if (jump < 0){
        decision = '맞는 문장 없음(연속 ' + missCount + (locked ? ', 올인 중' : '') + ')';
        setStatus('🎤 듣는 중: ' + shown + '  (대본과 맞지 않아 무시)');
        return;
      }
      best = jump; bigMove = true;
    } else {
      missCount = 0; recIdx = -1; recCount = 0;
    }
    if (bigMove) note = '  ⚠ ' + (best + 1) + '번째 문장으로 이동';

    // 위쪽 문장이나 바로 다음이 아닌 문장(건너뛰기)으로 옮기는 것은 같은 문장이 연속 2번 나올 때만
    if (best >= 0 && (best < cur || best >= cur + 2) && !bigMove){
      if (best === backIdx) backCount++; else { backIdx = best; backCount = 1; }
      if (backCount < 2){ decision = '이동 확인 중 → ' + (best + 1) + ' (1/2)'; setStatus('🎤 듣는 중: ' + shown); return; }
    }
    backIdx = -1; backCount = 0;
    if (best !== cur){
      var before = cur;
      setCur(best);
      decision = '이동 ' + (before + 1) + '→' + (best + 1) + (bigMove ? ' ⚠먼 이동' : '');
      if (bigMove) showUndo(before, best);
      scrollToCur();
    }

    // 현재 문장을 충분히 읽었으면 다음 문장으로
    // (문장 끝까지 읽은 경우는 1번, 그 전에 일찍 넘길 때는 연속 2번 확인 / 0.8초 간격)
    // 단, 말한 글자가 다른 문장과도 똑같이 맞는 경우(끝말이 같은 문장들 등)에는 넘기지 않음
    var otherMax = 0;
    for (var key2 in scores){ if (parseInt(key2, 10) !== cur && scores[key2] > otherMax) otherMax = scores[key2]; }
    var progress = readProgress(tail, cur);
    if (progress >= advancePoint() && cur + 1 < sentences.length && curScore - otherMax >= 0.10){
      advCount++;
      if ((advCount >= 2 || progress >= 0.97) && Date.now() - lastAdvance > 800){
        var delay = advanceDelay(), fin = progress >= 0.95;
        if (delay > 0) scheduleAdvance(cur, delay, fin, lastNormLen); else doAdvance(fin, lastNormLen);
      }
    } else {
      advCount = 0;
    }
    setStatus('🎤 듣는 중: ' + shown + note);
  }

  /* ---------- 음성 인식 ---------- */
  function createRec(){
    rec = new SR();
    rec.lang = 'ko-KR';
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    rec.onstart = function(){ baseLen = 0; lastNormLen = 0; lastEventTime = 0; lastHeard = Date.now(); setStatus('🎤 듣는 중: (말씀해 주세요)'); };

    rec.onresult = function(e){
      lastHeard = Date.now();
      var t = '';
      for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
      handleSpeech(t);
    };

    rec.onerror = function(e){
      logNote('인식 오류: ' + e.error);
      if (e.error === 'no-speech' || e.error === 'aborted') return;   // onend에서 다시 시작
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        stopMic('마이크가 차단되어 있습니다. 주소창 왼쪽 자물쇠 아이콘 → 마이크를 「허용」으로 바꾼 뒤 다시 시작해 주세요.');
      } else if (e.error === 'audio-capture'){
        stopMic('마이크를 찾을 수 없습니다. 마이크 연결을 확인해 주세요.');
      } else if (e.error === 'network'){
        stopMic('인터넷 연결 문제로 음성 인식이 중단되었습니다. 연결을 확인한 뒤 다시 시작해 주세요.');
      } else {
        stopMic('음성 인식 오류: ' + e.error);
      }
    };

    rec.onend = function(){
      if (!wantListen) return;
      setTimeout(function(){
        if (!wantListen) return;
        try { rec.start(); } catch (err) { /* 이미 시작된 경우 무시 */ }
      }, 300);
    };
  }

  function startMic(){
    if (!SR){ setStatus('이 브라우저는 음성 인식을 지원하지 않습니다. PC 크롬이나 엣지에서 열어 주세요.'); return; }
    if (editing){
      var same = ($('script-input').value === editStartText), pos = cur;
      if (!loadScript()){ setStatus('대본을 먼저 붙여넣어 주세요.'); return; }
      if (same && pos > 0 && pos < sentences.length) setCur(pos);
      setMode(false);
    }
    wantListen = true;
    createRec();
    try { rec.start(); } catch (err) { setStatus('시작 오류: ' + err.message); wantListen = false; return; }
    $('btn-mic').classList.add('on');
    $('btn-mic').textContent = '🎤 끄기';
    logNote('마이크 시작');
    requestWake();
    startSilenceWatch();
    if (navigator.permissions && navigator.permissions.query){
      navigator.permissions.query({ name: 'microphone' }).then(function(r){
        if (r.state === 'prompt') setStatus('마이크 허용 창이 뜨면 「허용」을 눌러 주세요(「이번에만 허용」은 매번 묻습니다).');
      }).catch(function(){});
    }
  }

  function stopMic(msg){
    wantListen = false;
    try { if (rec) rec.stop(); } catch (err) {}
    $('btn-mic').classList.remove('on');
    $('btn-mic').textContent = '🎤 시작';
    logNote('마이크 끔' + (msg ? ' (' + msg + ')' : ''));
    releaseWake();
    stopSilenceWatch();
    setStatus(msg || '🎤 꺼짐');
  }

  // 마이크가 켜져 있는 동안 화면이 꺼지거나 어두워지지 않게 함 (지원하는 브라우저만)
  function requestWake(){
    try {
      if (navigator.wakeLock && wantListen){
        navigator.wakeLock.request('screen').then(function(l){
          wakeLock = l;
          l.addEventListener('release', function(){ wakeLock = null; });
        }).catch(function(){});
      }
    } catch (err) {}
  }
  function releaseWake(){ try { if (wakeLock) wakeLock.release(); } catch (err) {} wakeLock = null; }
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && wantListen && !wakeLock) requestWake();
  });

  // 10초 넘게 아무 소리도 인식되지 않으면 알려 줌
  function startSilenceWatch(){
    clearInterval(silenceTimer);
    lastHeard = Date.now();
    silenceTimer = setInterval(function(){
      if (wantListen && Date.now() - lastHeard > 10000){
        setStatus('🎤 소리가 들리지 않습니다 (10초 넘게 인식 없음). 마이크 연결과 음량을 확인해 주세요.');
      }
    }, 1000);
  }
  function stopSilenceWatch(){ clearInterval(silenceTimer); silenceTimer = null; }

  /* ---------- 버튼 ---------- */
  $('btn-edit').addEventListener('click', function(){
    if (editing){
      var same = ($('script-input').value === editStartText), pos = cur;
      if (loadScript()){
        if (same && pos > 0 && pos < sentences.length) setCur(pos);   // 고치지 않았으면 읽던 위치 유지
        setMode(false);
      }
    } else {
      if (wantListen) stopMic();
      editStartText = $('script-input').value;
      setMode(true);
    }
  });

  // 📂 불러오기: 파일을 골라 대본 창으로 불러옴 (txt, docx, hwp, hwpx, pdf)
  $('btn-file').addEventListener('click', function(){ $('file-input').click(); });
  $('file-input').addEventListener('change', function(e){
    var f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    setStatus('「' + f.name + '」 읽는 중…');
    readFileText(f).then(function(text){
      if (wantListen) stopMic();
      $('script-input').value = text;
      setMode(true);
      lsSet('script', text);
      logNote('파일 불러옴: ' + f.name);
      setStatus('「' + f.name + '」 파일을 불러왔습니다. 내용을 확인하고 ✔ 완료를 누르세요.');
    }).catch(function(err){
      setStatus('파일을 불러오지 못했습니다: ' + (err && err.message ? err.message : '알 수 없는 오류'));
    });
  });
  $('btn-mic').addEventListener('click', function(){ wantListen ? stopMic() : startMic(); });

  $('btn-full').addEventListener('click', function(){
    if (document.fullscreenElement) document.exitFullscreen();
    else $('reader').requestFullscreen().catch(function(){ setStatus('전체화면을 열 수 없습니다.'); });
  });
  document.addEventListener('fullscreenchange', function(){
    $('btn-full').textContent = document.fullscreenElement ? '✖ 닫기' : '⛶ 전체화면';
    $('btn-full').classList.toggle('on', !!document.fullscreenElement);
    setTimeout(scrollToCur, 100);
  });

  function applySize(){
    $('text').style.fontSize = readerPt + 'pt';
    $('script-input').style.fontSize = readerPt + 'pt';
    lsSet('pt', String(readerPt));
    $('size-label').textContent = readerPt + 'pt';
  }
  $('btn-bigger').addEventListener('click', function(){ readerPt = Math.min(60, readerPt + 2); applySize(); });
  $('btn-smaller').addEventListener('click', function(){ readerPt = Math.max(14, readerPt - 2); applySize(); });

  $('th').addEventListener('input', function(){ $('th-label').textContent = signed($('th').value); });
  $('adv').addEventListener('input', function(){ $('adv-label').textContent = signed($('adv').value); });

  // 전체화면에서 대본 창을 더블클릭해도 기본 창으로 돌아감
  function dblExit(){
    if (document.fullscreenElement){
      if (window.getSelection) window.getSelection().removeAllRanges();
      document.exitFullscreen();
    }
  }
  $('text').addEventListener('dblclick', dblExit);
  $('script-input').addEventListener('dblclick', dblExit);

  // 문장을 클릭하면 그 문장을 시작 위치로
  $('text').addEventListener('click', function(e){
    var d = e.target.closest ? e.target.closest('.s') : null;
    if (!d) return;
    setCur(parseInt(d.dataset.i, 10));
    baseLen = lastNormLen;          // 클릭 전에 하신 말은 비교에서 제외
    missCount = 0; recIdx = -1; recCount = 0; farIdx = -1; farCount = 0;
    hideUndo();
    lastUserScroll = 0;
    scrollToCur();
    logNote('클릭으로 ' + (cur + 1) + '번째 문장 선택');
    setStatus('시작 위치: ' + (cur + 1) + '번째 문장');
  });

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }

  // 열릴 때마다 겹침·넘김은 항상 가운데(0)에서 시작 (크롬이 이전 값을 되살려 놓는 것을 막음)
  function resetSliders(){
    $('th').value = '0'; $('adv').value = '0';
    $('th-label').textContent = '0'; $('adv-label').textContent = '0';
  }
  resetSliders();
  window.addEventListener('pageshow', resetSliders);

  // 키보드: ↑ ↓ 로 현재 문장을 한 문장씩 옮김, 스페이스바로 🎤 켜기/끄기 (대본 입력 중에는 작동 안 함)
  document.addEventListener('keydown', function(e){
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var tn = e.target && e.target.tagName;
    if (tn === 'TEXTAREA' || tn === 'INPUT' || tn === 'SELECT' || editing) return;
    if (e.key === ' '){
      e.preventDefault();
      if (wantListen) stopMic(); else startMic();
      return;
    }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      if (!sentences.length) return;
      e.preventDefault();
      var ni = Math.max(0, Math.min(sentences.length - 1, cur + (e.key === 'ArrowDown' ? 1 : -1)));
      if (ni === cur) return;
      setCur(ni);
      baseLen = lastNormLen;
      missCount = 0; recIdx = -1; recCount = 0; farIdx = -1; farCount = 0;
      hideUndo();
      lastUserScroll = 0;
      scrollToCur();
      logNote('키보드로 ' + (cur + 1) + '번째 문장 선택');
      setStatus('수동 이동: ' + (cur + 1) + '번째 문장');
    }
  });
  // 버튼을 누른 뒤에는 포커스를 풀어서, 스페이스바가 같은 버튼을 다시 누르지 않게 함
  document.addEventListener('click', function(e){ if (e.target && e.target.tagName === 'BUTTON') e.target.blur(); });

  // 인식 기록 복사
  function buildLogText(){
    var L = [];
    L.push('낭독 기록 ' + APP_VERSION + ' / ' + new Date().toLocaleString('ko-KR'));
    L.push('겹침 ' + signed($('th').value) + ' · 넘김 ' + signed($('adv').value) + ' · 대본 ' + sentences.length + '문장 · 글자 ' + readerPt + 'pt');
    var used = {};
    logRows.forEach(function(r){ if (r.from != null) used[r.from] = 1; if (r.to != null) used[r.to] = 1; });
    L.push('--- 기록에 나온 문장 (번호: 앞부분) ---');
    Object.keys(used).map(Number).sort(function(a, b){ return a - b; }).forEach(function(i){
      if (sentences[i]) L.push((i + 1) + ': ' + sentences[i].slice(0, 30));
    });
    L.push('--- 기록 (시각 [문장 번호] 판단 | 지금 문장 점수 | 인식한 글자) ---');
    logRows.forEach(function(r){
      if (r.note){ L.push(fmtTime(r.t) + ' ※ ' + r.note); return; }
      var pos = '[' + (r.from + 1) + (r.from !== r.to ? '→' + (r.to + 1) : '') + ']';
      L.push(fmtTime(r.t) + ' ' + pos + ' ' + r.dec + ' | ' + r.cs.toFixed(2) + ' | ' + r.tail);
    });
    return L.join('\n');
  }
  $('btn-log').addEventListener('click', function(){
    var text = buildLogText(), n = logRows.length;
    function done(){ setStatus('📋 기록 ' + n + '줄을 복사했습니다. 붙여넣어 보내 주세요.'); }
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (err) { setStatus('복사하지 못했습니다.'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else { fallback(); }
  });

  // 대본은 입력할 때마다 이 컴퓨터에 저장
  var scriptSaveTimer = null;
  $('script-input').addEventListener('input', function(){
    clearTimeout(scriptSaveTimer);
    scriptSaveTimer = setTimeout(function(){ lsSet('script', $('script-input').value); }, 600);
  });

  // 열 때: 마지막 글자 크기와, 읽던 대본·위치를 이어서 불러옴
  (function restore(){
    var pt = parseInt(lsGet('pt'), 10);
    if (pt >= 14 && pt <= 60) readerPt = pt;
    applySize();
    var saved = lsGet('script'), si = parseInt(lsGet('cur'), 10);
    if (saved && saved.trim()){
      $('script-input').value = saved;
      editStartText = saved;
      if (loadScript()){
        if (si > 0 && si < sentences.length) setCur(si);
        setMode(false);
        setStatus('이전에 읽던 대본을 불러왔습니다. (' + (cur + 1) + '번째 문장부터)');
      }
    }
  })();

  // 앱 창(주소창 없는 창)으로 열렸을 때 화면에서 쓸 수 있는 크기만큼 창을 키움 (일반 탭에서는 브라우저가 무시함)
  try {
    if (window.outerWidth < screen.availWidth - 20 || window.outerHeight < screen.availHeight - 20){
      window.moveTo(screen.availLeft || 0, screen.availTop || 0);
      window.resizeTo(screen.availWidth, screen.availHeight);
    }
  } catch (err) { /* 막혀 있으면 그대로 둠 */ }

  if (!SR) setStatus('이 브라우저는 음성 인식을 지원하지 않습니다. PC 크롬이나 엣지에서 열어 주세요.');
})();
</script>
</body>
</html>
